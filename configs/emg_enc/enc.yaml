model_size: 768
num_layers: 6
dropout: 0.2
use_channel: [0, 1, 2, 3, 4, 5, 6, 7]
channel_dropout: 0.
use_video: true
# emg_only|video_only|both
modality: both
# concat|high_concat|ca|ab
fusion_method: ab
fusion_num_heads: 8
ab_num_tokens: 32
# fusion point inside the 6-layer transformer:
# run EMG-only transformer layers [0:fusion_after_layer), then fuse, then run remaining layers.
fusion_after_layer: 2
# freeze|finetune|scratch
video_encoder_mode: freeze
# ids|logits|hidden
video_encoder_output: hidden
video_encoder_ckpt: /data2/spjune/v2sflow/v2sflow_encoder.pt
video_content_vocab_size: 1000